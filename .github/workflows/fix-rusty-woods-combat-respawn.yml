name: Fix Rusty Woods combat respawn
on:
  push:
    branches: [feat/rusty-woods-combat-pass]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rusty-woods-combat-pass
      - name: Clear stale combat state on respawn
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='packages/game-core/world.ts';
          let s=fs.readFileSync(file,'utf8');
          const from="if(m.hp<=0){if(next.interior!==11&&now>=m.respawn){m.hp=isWoodsMonster(m.id)?woodsMonsterHealth(m.id):m.kind==='bug'?100:m.kind==='rat'?40:60;Object.assign(m,home);m.mode='patrol';}continue;}";
          const to="if(m.hp<=0){if(next.interior!==11&&now>=m.respawn){m.hp=isWoodsMonster(m.id)?woodsMonsterHealth(m.id):m.kind==='bug'?100:m.kind==='rat'?40:60;Object.assign(m,home);m.mode='patrol';delete m.windup;delete m.slamAt;delete m.navPath;delete m.navGoal;m.lastSkill=now;m.lastSlam=now;m.skillCycle=0;}continue;}";
          const n=s.split(from).length-1;if(n!==1)throw new Error(`respawn anchor count ${n}`);
          fs.writeFileSync(file,s.replace(from,to));
          NODE
      - name: Commit respawn cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/game-core/world.ts
          git diff --cached --check
          git commit -m "Clear stale forest combat state on respawn [skip ci]"
          git push origin HEAD:feat/rusty-woods-combat-pass
