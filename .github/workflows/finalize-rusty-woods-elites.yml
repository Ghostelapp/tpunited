name: Finalize Rusty Woods elites
on:
  push:
    branches: [feat/rusty-woods-events-elites]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rusty-woods-events-elites
      - name: Keep elite arenas clear and preserve Roots of Rust semantics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const replaceOnce=(file,from,to,label)=>{let s=fs.readFileSync(file,'utf8');const n=s.split(from).length-1;if(n!==1)throw new Error(`${label}: ${n}`);fs.writeFileSync(file,s.replace(from,to));};
          replaceOnce('packages/game-core/woods.ts',
            "{id:28,x:3220,y:1360,kind:'bug',species:'hauler-sentinel',hp:480,respawn:0,elite:true}",
            "{id:28,x:3180,y:1430,kind:'bug',species:'hauler-sentinel',hp:480,respawn:0,elite:true}",
            'sentinel spawn');
          replaceOnce('packages/game-core/world.ts',
            "if(isWoodsMonster(hit.id)&&next.woodsQuest==='active'){if(hit.kind==='boss')next.woodsBoss=true;else next.woodsKills=(next.woodsKills??0)+1;}",
            "if(isWoodsMonster(hit.id)&&next.woodsQuest==='active'){if(hit.kind==='boss')next.woodsBoss=true;else if(!isWoodsElite(hit.id))next.woodsKills=(next.woodsKills??0)+1;}",
            'quest elite exclusion');
          NODE
      - name: Commit elite cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/game-core/woods.ts packages/game-core/world.ts
          git diff --cached --check
          git commit -m "Polish elite arena placement and quest compatibility [skip ci]"
          git push origin HEAD:feat/rusty-woods-events-elites
