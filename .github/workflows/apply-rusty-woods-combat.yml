name: Apply Rusty Woods combat pass
on:
  push:
    branches: [feat/rusty-woods-combat-pass]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rusty-woods-combat-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch authoritative forest combat
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='packages/game-core/world.ts';
          let source=fs.readFileSync(file,'utf8');
          const once=(from,to,label)=>{const n=source.split(from).length-1;if(n!==1)throw new Error(`${label}: expected 1 anchor, found ${n}`);source=source.replace(from,to);};
          once(
            "import {WOODS_SPAWNS,WOODS_TREES,isWoodsMonster,woodsMonsterHealth,woodsKillReward} from './woods.ts';",
            "import {WOODS_SPAWNS,WOODS_TREES,isWoodsMonster,woodsMonsterHealth,woodsKillReward} from './woods.ts';\nimport {woodsBossPhase,woodsSkillSpec,type WoodsSkill} from './woods-combat.ts';",
            'combat import'
          );
          once(
            "export type Monster={windup?:{at:number;x:number;y:number};lastSkill?:number;navPath?:{x:number;y:number}[];navAt?:number;navGoal?:{x:number;y:number};mode?:'patrol'|'chase'|'return';waypoint?:number;slamAt?:number;lastSlam?:number;kind?:'slime'|'rat'|'bug'|'boss';id:number;x:number;y:number;hp:number;respawn:number};",
            "export type Monster={windup?:{at:number;x:number;y:number;skill?:WoodsSkill};lastSkill?:number;skillCycle?:number;navPath?:{x:number;y:number}[];navAt?:number;navGoal?:{x:number;y:number};mode?:'patrol'|'chase'|'return';waypoint?:number;slamAt?:number;lastSlam?:number;kind?:'slime'|'rat'|'bug'|'boss';id:number;x:number;y:number;hp:number;respawn:number};",
            'monster type'
          );
          const start=" const speed=(m.kind==='boss'?38:m.kind==='rat'?90:m.kind==='bug'?48:52)*(m.mode==='patrol'?.45:1);";
          const end=" let destination=target,stop=m.mode==='chase'?38:4;";
          const a=source.indexOf(start),b=source.indexOf(end,a);
          if(a<0||b<0)throw new Error('monster combat anchors missing');
          const replacement=` const forestSkill=isWoodsMonster(m.id)&&m.kind!=='boss'?woodsSkillSpec(m.id):undefined;\n const bossPhase=isWoodsMonster(m.id)&&m.kind==='boss'?woodsBossPhase(m.hp):undefined;\n const speed=(bossPhase?38*bossPhase.speedMultiplier:forestSkill?.moveSpeed??(m.kind==='boss'?38:m.kind==='rat'?90:m.kind==='bug'?48:52))*(m.mode==='patrol'?.45:1);\n if(m.kind==='boss'){\n  if(bossPhase){\n   if(m.slamAt&&now>=m.slamAt){if(now>=(next.dodgeUntil??0)&&Math.hypot(m.x-next.x,m.y-next.y)<bossPhase.slamRadius&&clearMonsterPath(m,next,next.interior)){next.hp-=Math.max(2,bossPhase.slamDamage-gearStats(next).armor);next.lastDamage=now;next.events.push(\`Ironroot phase ${'${bossPhase.phase}'} · ground slam!\`);}m.slamAt=undefined;m.lastSlam=now;m.lastSkill=now;}\n   else if(m.windup?.skill==='root-burst'&&now>=m.windup.at){const root=m.windup;delete m.windup;m.lastSkill=now;if(now>=(next.dodgeUntil??0)&&Math.hypot(next.x-root.x,next.y-root.y)<bossPhase.rootRadius&&clearMonsterPath(m,next,next.interior)){next.hp-=Math.max(2,bossPhase.rootDamage-gearStats(next).armor);next.lastDamage=now;next.events.push('Ironroot roots erupted beneath you!');}}\n   else if(m.mode==='chase'&&!m.slamAt&&!m.windup&&now-(m.lastSkill??m.lastSlam??0)>bossPhase.cooldown&&toPlayer<Math.max(190,bossPhase.rootRange)){const useRoot=bossPhase.phase>1&&((m.skillCycle??0)%2===1)&&toPlayer<bossPhase.rootRange;m.skillCycle=(m.skillCycle??0)+1;if(useRoot)m.windup={skill:'root-burst',at:now+bossPhase.rootWindup,x:next.x,y:next.y};else if(toPlayer<210)m.slamAt=now+bossPhase.slamWindup;}\n  }else{\n   if(m.slamAt&&now>=m.slamAt){if(now>=(next.dodgeUntil??0)&&Math.hypot(m.x-next.x,m.y-next.y)<145&&clearMonsterPath(m,next,next.interior)){next.hp-=Math.max(2,28-gearStats(next).armor);next.lastDamage=now;next.events.push('Ground slam! Move out of the warning ring.');}m.slamAt=undefined;m.lastSlam=now;}\n   else if(m.mode==='chase'&&!m.slamAt&&now-(m.lastSlam??0)>4500&&toPlayer<180)m.slamAt=now+1100;\n  }\n }\n if(m.kind!=='boss'){\n  if(forestSkill){\n   if(m.windup&&now>=m.windup.at){const target=m.windup;m.lastSkill=now;delete m.windup;if(forestSkill.origin==='impact'&&forestSkill.dashMs)moveMonster(m,target,forestSkill.dashMs,forestSkill.dashScale??.3,activeMonsters(next),0,next.interior);const center=forestSkill.origin==='target'?target:forestSkill.origin==='impact'?m:m;if(now>=(next.dodgeUntil??0)&&Math.hypot(next.x-center.x,next.y-center.y)<forestSkill.radius&&clearMonsterPath(m,next,next.interior)){next.hp-=Math.max(1,forestSkill.damage-gearStats(next).armor);next.lastDamage=now;next.events.push(\`${'${forestSkill.label}'}! Dodge the telegraph.\`);}}\n   else if(!m.windup&&m.mode==='chase'&&now-(m.lastSkill??0)>forestSkill.cooldown&&toPlayer<forestSkill.range&&clearMonsterPath(m,next,next.interior))m.windup={skill:forestSkill.skill,at:now+forestSkill.windup,x:next.x,y:next.y};\n  }else{\n   if(m.windup&&now>=m.windup.at){const target=m.windup;m.lastSkill=now;delete m.windup;if(m.kind==='rat')moveMonster(m,target,480,.25,activeMonsters(next),0,next.interior);const center=m.kind==='slime'?target:m,radius=m.kind==='slime'?65:m.kind==='bug'?95:60;if(now>=(next.dodgeUntil??0)&&Math.hypot(next.x-center.x,next.y-center.y)<radius&&clearMonsterPath(m,next,next.interior)){next.hp-=Math.max(1,(m.kind==='bug'?20:m.kind==='rat'?10:12)-gearStats(next).armor);next.lastDamage=now;}}\n   else if(!m.windup&&m.mode==='chase'&&now-(m.lastSkill??0)>1800&&toPlayer<(m.kind==='slime'?220:m.kind==='rat'?150:115)&&clearMonsterPath(m,next,next.interior))m.windup={at:now+(m.kind==='bug'?950:m.kind==='slime'?800:650),x:next.x,y:next.y};\n  }\n }\n if(!m.slamAt&&!m.windup){\n let destination=target,stop=m.mode==='chase'?(forestSkill?.stopDistance??38):4;`;
          source=source.slice(0,a)+replacement+source.slice(b+end.length);
          fs.writeFileSync(file,source);
          NODE
      - name: Commit combat patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/game-core/world.ts
          git diff --cached --check
          git commit -m "Add authoritative Rusty Woods combat skills [skip ci]"
          git push origin HEAD:feat/rusty-woods-combat-pass
