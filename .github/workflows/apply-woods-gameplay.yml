name: Apply woods gameplay polish
on:
  push:
    branches: [feat/rusty-woods-content-pass]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rusty-woods-content-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch forest rewards and quest copy
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='packages/game-core/world.ts';
          let source=fs.readFileSync(file,'utf8');
          const replaceOnce=(from,to,label)=>{const count=source.split(from).length-1;if(count!==1)throw new Error(`${label}: expected 1 anchor, found ${count}`);source=source.replace(from,to);};
          replaceOnce(
            "import {WOODS_SPAWNS,WOODS_TREES,isWoodsMonster,woodsMonsterHealth} from './woods.ts';",
            "import {WOODS_SPAWNS,WOODS_TREES,isWoodsMonster,woodsMonsterHealth,woodsKillReward} from './woods.ts';",
            'woods import'
          );
          replaceOnce(
            "The Ironroot Guardian has awakened. Help me reclaim the forest. [E] Accept or turn in Roots of Rust.",
            "The Ironroot Golem has awakened. Help me reclaim the forest. [E] Accept or turn in Roots of Rust.",
            'ranger copy'
          );
          replaceOnce(
            "next.events.push('+12 scrap · +1 circuit · +20 XP');awardLoot(next,hit,now);",
            "next.events.push('+12 scrap · +1 circuit · +20 XP');const forestReward=woodsKillReward(hit.id);if(forestReward){next.scrap+=forestReward.scrap;next.circuits+=forestReward.circuits;next.xp+=forestReward.xp;const circuitText=forestReward.circuits?` · +${forestReward.circuits} circuit${forestReward.circuits===1?'':'s'}`:'';next.events.push(`${forestReward.label} · +${forestReward.scrap} scrap${circuitText} · +${forestReward.xp} XP`);}awardLoot(next,hit,now);",
            'kill reward'
          );
          replaceOnce(
            "Roots of Rust accepted: defeat 6 forest creatures and the Ironroot Guardian, then return to Moss.",
            "Roots of Rust accepted: defeat 6 forest creatures and the Ironroot Golem, then return to Moss.",
            'quest accept copy'
          );
          replaceOnce(
            " · Guardian: ${next.woodsBoss?'defeated':'alive'}.",
            " · Golem: ${next.woodsBoss?'defeated':'alive'}.",
            'quest progress copy'
          );
          fs.writeFileSync(file,source);
          NODE
      - name: Commit gameplay polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/game-core/world.ts
          git diff --cached --check
          git commit -m "Add distinct Rusty Woods salvage rewards [skip ci]"
          git push origin HEAD:feat/rusty-woods-content-pass
