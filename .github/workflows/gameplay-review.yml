name: Gameplay review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run game:test
      - run: npm run realtime:test
      - run: node --test scripts/wallet-client.test.mjs
      - run: npm run social:test
      - run: npm run analytics:test
      - run: npm run art:test
      - run: npm run build
      - run: npm run realtime:build
      - run: npm run realtime:integration:app
