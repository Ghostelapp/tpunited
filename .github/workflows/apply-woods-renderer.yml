name: Apply woods monster renderer
on:
  push:
    branches: [feat/rusty-woods-content-pass]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rusty-woods-content-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch game renderer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='components/tpu/game.tsx';
          let source=fs.readFileSync(file,'utf8');
          const importNeedle="import {woodsObjects} from './woods';";
          if(!source.includes("from './woods-monsters'")){
            if(!source.includes(importNeedle))throw new Error('woods import anchor missing');
            source=source.replace(importNeedle,importNeedle+"\nimport {drawWoodsMonster,WOODS_MONSTER_SHEET} from './woods-monsters';");
          }
          const beforeLoads=(source.match(/\[1,2,3,5,6,7,8,10,99\]/g)||[]).length;
          source=source.replaceAll('[1,2,3,5,6,7,8,10,99]','[1,2,3,5,6,7,8,9,10,99]');
          if(beforeLoads!==2&&!source.includes('[1,2,3,5,6,7,8,9,10,99]'))throw new Error(`unexpected sheet load anchors: ${beforeLoads}`);
          const start=" ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(visual.x,visual.y+2,25,7,0,0,Math.PI*2);ctx.fill();";
          const label="if(isWoodsMonster(m.id)){ctx.fillStyle='#d7c787';";
          const a=source.indexOf(start),b=source.indexOf(label,a);
          if(a<0||b<0)throw new Error('monster renderer anchors missing');
          const replacement=` const flash=damageNumbers.current.some(hit=>now-hit.at<180&&Math.hypot(hit.x-m.x,hit.y-m.y)<20);\n ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(visual.x,visual.y+2,m.kind==='boss'?42:25,m.kind==='boss'?11:7,0,0,Math.PI*2);ctx.fill();\n if(m.kind==='boss'&&m.slamAt){ctx.fillStyle='#fa594b33';ctx.strokeStyle='#ff7055';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,145,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffd2bd';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('GROUND SLAM — MOVE!',m.x,m.y-155);ctx.textAlign='left';}\n ctx.save();ctx.translate(visual.x,visual.y);ctx.scale(visual.face,1);\n if(isWoodsMonster(m.id)){drawWoodsMonster(ctx,images.current[WOODS_MONSTER_SHEET],m.id,walking,visual.distance,now,flash);}\n else {if(flash)ctx.filter='brightness(2)';\n  if(m.kind==='boss')drawSprite(2,14,987,278,211,-70,-106,140,106);\n  else if(m.kind==='rat'){const f=walking?1+Math.floor(visual.distance/13)%2:0;const frames=[[282,47,146,94],[439,44,133,97],[588,42,121,99]];const [sx,sy,sw,sh]=frames[f];drawSprite(2,sx,sy,sw,sh,-sw*.23,-sh*.46,sw*.46,sh*.46);}\n  else if(m.kind==='bug'){const f=walking?1+Math.floor(visual.distance/11)%2:0;const frames=[[392,224,132,94],[392,224,132,94],[529,222,146,98]];const [sx,sy,sw,sh]=frames[f];drawSprite(2,sx,sy,sw,sh,-sw*.24,-sh*.48,sw*.48,sh*.48);}\n  else {const pulse=walking?Math.sin(visual.distance/9)*.06:Math.sin(now/450+m.id)*.018;ctx.scale(1+pulse,1-pulse);drawSprite(2,274,803,133,84,-32,-41,64,41);}\n }\n ctx.restore();`;
          source=source.slice(0,a)+replacement+source.slice(b);
          source=source.replace("visual.y-(m.kind==='boss'?125:68)","visual.y-(m.kind==='boss'?132:72)");
          fs.writeFileSync(file,source);
          NODE
      - name: Commit patched renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/tpu/game.tsx
          git diff --cached --check
          git commit -m "Render real Rusty Woods monster atlas [skip ci]"
          git push origin HEAD:feat/rusty-woods-content-pass
